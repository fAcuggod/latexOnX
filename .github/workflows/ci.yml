name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Run Rust core tests
        run: npm run test:rust

      - name: Build Rust/WASM core
        run: npm run build:wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit, DOM, and WASM equivalence tests
        run: npm test

      - name: Build Chrome extension and demo
        run: npm run build:all

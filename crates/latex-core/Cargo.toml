[package]
name = "latex-core"
version = "1.0.0"
edition = "2021"
description = "Zero-dependency Rust/WebAssembly pure core (parser and anti-DoS validator) for LaTeX on X."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

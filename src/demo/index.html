<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX on X — Demo con KaTeX real</title>
  <link rel="stylesheet" href="katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f9f9;
      --border: #eff3f4;
      --text: #0f1419;
      --muted: #536471;
      --accent: #1d9bf0;
    }
    [data-theme="dim"] {
      --bg: #15202b;
      --surface: #1e2732;
      --border: #38444d;
      --text: #f7f9f9;
      --muted: #8b98a5;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #16181c;
      --border: #2f3336;
      --text: #e7e9ea;
      --muted: #71767b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 28px 18px 56px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #0f1419, #1d9bf0);
      color: #fff; font-weight: 700; font-size: 20px;
      display: grid; place-items: center;
    }
    h1 { margin: 0; font-size: 19px; }
    .subtitle { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .themes { display: flex; gap: 6px; }
    .btn {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn.active, .btn:hover { border-color: var(--accent); color: var(--accent); }
    .composer {
      margin-top: 20px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    textarea {
      width: 100%; min-height: 88px; resize: vertical;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    }
    .composer-footer {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    .publish-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 7px 16px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .feed { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .tweet {
      border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
      background: var(--bg);
    }
    .tweet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .author { font-weight: 700; font-size: 14px; }
    .handle { color: var(--muted); font-size: 13px; }
    [data-testid="tweetText"] {
      font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    [data-testid="tweetText"] a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="logo">∑</div>
        <div>
          <h1>LaTeX on X — Sandbox con KaTeX real</h1>
          <p class="subtitle">Usa el mismo <code>domProcessor</code> y <code>MutationObserver</code> de la extensión</p>
        </div>
      </div>
      <div class="themes">
        <button class="btn" data-set-theme="light">Claro</button>
        <button class="btn" data-set-theme="dim">Noche clara</button>
        <button class="btn active" data-set-theme="dark">Oscuro</button>
      </div>
    </header>

    <section class="composer">
      <textarea id="composer-input">Probá escribir un tweet con \(e^{i\pi} + 1 = 0\), un precio como $50 o $BTC, y un bloque:
$$\int_0^\infty e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}$$</textarea>
      <div class="composer-footer">
        <span>Clic en cualquier fórmula renderizada para copiar su LaTeX.</span>
        <button id="publish-btn" class="publish-btn">Agregar tweet al feed</button>
      </div>
    </section>

    <main id="feed" class="feed"></main>
  </div>

  <script src="demo.js"></script>
</body>
</html>
